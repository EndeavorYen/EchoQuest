<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoQuest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23f4efe1'/%3E%3Cpath d='M32 9l5 17 17 6-17 6-5 17-6-17-16-6 16-6z' fill='none' stroke='%233f7659' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --forest-ink: #17233b;
      --forest-leaf: #2f8f67;
      --forest-sun: #ffcf5a;
      --forest-coral: #ef624d;
      --forest-sky: #99d8df;
      --eq-ink: var(--forest-ink);
      --eq-muted: #496078;
      --eq-paper: #dff0dd;
      --eq-panel: rgba(255, 255, 255, .92);
      --eq-forest: var(--forest-leaf);
      --eq-river: #30778f;
      --eq-rust: var(--forest-coral);
      --eq-sun: var(--forest-sun);
      --eq-focus: #173d78;
    }

    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; }
    body {
      margin: 0;
      font-family: 'Noto Sans TC', 'Trebuchet MS', sans-serif;
      color: var(--forest-ink);
      background: var(--eq-paper);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--eq-focus);
      outline-offset: 3px;
    }

    .eq-adventure { min-height:100dvh; color:var(--forest-ink); background:#dff0dd; overflow:hidden; }
    .eq-adventure-hud { position:fixed; z-index:20; inset:16px 16px auto; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; pointer-events:none; }
    .eq-adventure-hud > * { pointer-events:auto; }
    .eq-adventure-hud > div:first-child {
      display: grid;
      gap: 2px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 8px;
      color: #fff;
      background: rgba(23,35,59,.38);
      box-shadow: 0 6px 18px rgba(23,35,59,.18);
      text-shadow: 0 1px 3px rgba(23,35,59,.65);
    }
    .eq-adventure-hud span { font-size: .8rem; font-weight: 800; }
    .eq-adventure-hud strong { font-family: 'Baloo 2', sans-serif; font-size: 1.2rem; line-height: 1; }
    .eq-adventure-hud-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
    .eq-adventure-hud nav { display:flex; gap:6px; padding:4px; border:1px solid rgba(255,255,255,.58); border-radius:8px; background:rgba(255,255,255,.9); box-shadow:0 6px 18px rgba(23,35,59,.16); }
    .eq-adventure-hud nav button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--forest-ink);
      background: transparent;
      font-size: .82rem;
      font-weight: 900;
    }
    .eq-adventure-hud nav button[aria-pressed='true'] { color: #fff; background: var(--forest-leaf); }

    .eq-adventure-scene { position:relative; min-height:100dvh; padding:104px clamp(20px,5vw,72px) 136px; background:#b9dfc2; }
    .eq-adventure--bridge .eq-adventure-scene { background:#88c9d1; }
    .eq-adventure--rescue .eq-adventure-scene { background:var(--forest-sky); }
    .eq-adventure--complete .eq-adventure-scene { background:var(--forest-leaf); }
    .eq-scene-copy { position:relative; z-index:2; max-width:430px; color:#fff; text-shadow:0 2px 12px rgba(23,35,59,.72); }
    .eq-scene-copy p { margin:0 0 10px; font-weight:800; }
    .eq-scene-copy p:first-child { font-size:.82rem; letter-spacing:0; }
    .eq-scene-copy h1 { margin:0; font-family:'Baloo 2','Noto Sans TC',sans-serif; font-size:clamp(2.1rem,4.6vw,4.2rem); line-height:.95; letter-spacing:0; }
    .eq-boss-intent { max-width: 320px; padding: 8px 10px; border-left: 4px solid var(--forest-sun); background: rgba(23,35,59,.38); }
    .eq-scene-character { position:absolute; right:4vw; bottom:110px; width:min(44vw,560px); }
    .eq-scene-character img { display:block; width:100%; max-height:68dvh; object-fit:contain; object-position:bottom right; filter:drop-shadow(0 12px 18px rgba(23,35,59,.3)); }

    .eq-world-challenge { position:absolute; z-index:3; left:5vw; bottom:120px; width:min(520px,90vw); max-width:min(520px,90vw); padding:16px; border:1px solid rgba(255,255,255,.72); border-radius:8px; background:rgba(255,255,255,.94); box-shadow:0 14px 30px rgba(23,35,59,.24); }
    .eq-target-card { display:flex; align-items:center; gap:14px; }
    .eq-target-card img { width:92px; height:82px; object-fit:contain; }
    .eq-target-card span { display:grid; width:92px; height:82px; place-items:center; color:var(--forest-leaf); font-size:2rem; font-weight:900; }
    .eq-word-clue { margin:8px 0 12px; }
    .eq-word-clue p { margin:0; color:var(--forest-leaf); font-size:.8rem; font-weight:900; }
    .eq-word-clue h2 { margin:2px 0; font-family:'Baloo 2','Noto Sans TC',sans-serif; font-size:1.55rem; letter-spacing:0; line-height:1.1; }
    .eq-word-clue span { color:#496078; font-size:.88rem; font-weight:700; }
    .eq-choice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .eq-picture-choice { min-height:96px; border:2px solid #c8e0d2; border-radius:8px; background:#f9fffb; box-shadow:inset 0 -3px rgba(47,143,103,.1); }
    .eq-picture-choice:hover { border-color:var(--forest-leaf); background:#eaf8ef; }
    .eq-picture-choice img { width:100%; height:78px; object-fit:contain; }
    .eq-picture-choice span { color:var(--forest-leaf); font-size:2rem; font-weight:900; }
    .eq-letter-game, .eq-typing-game, .eq-voice-panel { display:grid; gap:10px; }
    .eq-letter-answer, .eq-transcript-line { min-height:42px; margin:0; display:flex; align-items:center; padding:8px 10px; border:1px solid #c8e0d2; border-radius:6px; background:#f8fffa; font-weight:800; }
    .eq-letter-bank { display:flex; flex-wrap:wrap; gap:7px; }
    .eq-letter-tile { width:42px; height:42px; border:0; border-radius:6px; color:#fff; background:var(--forest-leaf); font-family:'Baloo 2',sans-serif; font-size:1.2rem; font-weight:900; box-shadow:inset 0 -3px rgba(0,0,0,.15); }
    .eq-letter-tile:disabled { opacity:.35; cursor:not-allowed; }
    .eq-row-actions, .eq-voice-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .eq-typing-game { grid-template-columns:minmax(0,1fr) auto; }
    .eq-typing-game input, .eq-select { min-height:44px; border:1px solid #89b7b5; border-radius:6px; padding:9px 11px; color:var(--forest-ink); background:#fff; font-weight:700; }
    .eq-voice-panel { margin-top:12px; padding-top:12px; border-top:1px solid #d9e8dd; }
    .eq-voice-review { display:grid; gap:7px; padding:10px; border:1px solid #9bc7c8; border-radius:6px; background:#edfafa; }
    .eq-voice-note { margin:0; color:#496078; font-size:.9rem; font-weight:700; }
    .eq-adventure-message { margin:12px 0 0; font-weight:900; }
    .eq-adventure-message--correct { color:var(--forest-leaf); }
    .eq-adventure-message--wrong { color:#b84537; }
    .eq-adventure-message--voice { color:#276e86; }

    .eq-arcade-primary, .eq-arcade-secondary, .eq-arcade-danger, .eq-arcade-small-button, .eq-button {
      min-height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      border:0;
      border-radius:6px;
      padding:9px 12px;
      font-weight:900;
      box-shadow:inset 0 -3px rgba(0,0,0,.16);
    }
    .eq-arcade-primary, .eq-button--primary { color:#17233b; background:var(--forest-sun); }
    .eq-arcade-secondary, .eq-button--secondary { color:#fff; background:#30778f; }
    .eq-arcade-danger, .eq-button--danger { color:#fff; background:var(--forest-coral); }
    .eq-arcade-small-button, .eq-button--quiet { color:#17233b; background:#fff; }
    .eq-button--gold { color:#17233b; background:var(--forest-sun); }
    .eq-arcade-primary:disabled, .eq-arcade-secondary:disabled, .eq-arcade-danger:disabled, .eq-arcade-small-button:disabled { opacity:.45; cursor:not-allowed; }

    .eq-spell-dock { position:fixed; z-index:30; inset:auto 50% 18px auto; transform:translateX(50%); display:grid; grid-template-columns:repeat(3,minmax(92px,150px)); gap:10px; }
    .eq-spell-dock button { min-height:64px; border:0; border-radius:12px; color:#17233b; background:var(--forest-sun); font-weight:900; box-shadow:inset 0 -5px rgba(0,0,0,.18),0 8px 20px rgba(23,35,59,.25); }
    .eq-spell-dock button:nth-child(2) { background:var(--forest-sky); }
    .eq-spell-dock button:nth-child(3) { background:#b9e4be; }
    .eq-spell-dock button:disabled { opacity:.55; cursor:not-allowed; }

    .eq-adventure-vocab { min-height:100dvh; padding:20px; }
    .eq-screen { min-height:100%; padding:16px 0; }
    .eq-vocab-shell { width:min(100%,980px); margin:0 auto; }
    .eq-panel { border:1px solid #c8e0d2; border-radius:8px; background:var(--eq-panel); box-shadow:0 14px 30px rgba(23,35,59,.16); }
    .eq-display { font-family:'Baloo 2','Noto Sans TC',sans-serif; letter-spacing:0; }
    .eq-vocab-list { max-height:520px; overflow:auto; border:1px solid #c8e0d2; border-radius:6px; }
    .eq-vocab-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px; border-bottom:1px solid #d9e8dd; }
    .eq-vocab-row:last-child { border-bottom:0; }
    .eq-preview { width:64px; height:64px; border:1px solid #c8e0d2; border-radius:6px; object-fit:contain; background:#fff; }
    .eq-preview--empty { display:grid; place-items:center; color:var(--forest-leaf); font-weight:900; }

    @media (max-width:640px) {
      .eq-adventure-hud { inset:8px; gap:6px; }
      .eq-adventure-hud > div:first-child { padding:7px 9px; }
      .eq-adventure-hud-actions { gap:4px; }
      .eq-adventure-hud nav { gap:2px; }
      .eq-adventure-hud nav button { min-height:32px; padding:5px 6px; font-size:.72rem; }
      .eq-adventure-hud .eq-arcade-small-button { min-height:32px; padding:6px 8px; font-size:.76rem; }
      .eq-adventure-scene { padding:82px 14px 164px; }
      .eq-scene-character { right:-14vw; bottom:190px; width:78vw; opacity:.9; }
      .eq-world-challenge { left:14px; right:14px; bottom:92px; width:auto; max-width:none; }
      .eq-spell-dock { inset:auto 8px 8px; transform:none; grid-template-columns:repeat(3,1fr); }
      .eq-spell-dock button, .eq-picture-choice { min-height:72px; }
      .eq-vocab-row { grid-template-columns:auto minmax(0,1fr); }
      .eq-vocab-actions { grid-column:1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
      .eq-word-stage--feedback-success,
      .eq-word-stage--feedback-caution,
      .eq-word-stage--feedback-celebration,
      .eq-word-stage--feedback-voice,
      .eq-enemy-figure--feedback-success,
      .eq-enemy-figure--feedback-caution,
      .eq-enemy-figure--feedback-celebration { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.js"></script>
</body>
</html>
