<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoQuest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23f4efe1'/%3E%3Cpath d='M32 9l5 17 17 6-17 6-5 17-6-17-16-6 16-6z' fill='none' stroke='%233f7659' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --eq-ink: #25322c;
        --eq-muted: #687264;
        --eq-paper: #f4efe1;
        --eq-paper-strong: #fff8e8;
        --eq-panel: rgba(255, 250, 235, 0.91);
        --eq-panel-solid: #fff7e6;
        --eq-line: #bfa66a;
        --eq-line-strong: #8b6e31;
        --eq-forest: #3f7659;
        --eq-river: #2f7288;
        --eq-rust: #b4563c;
        --eq-ruby: #a83d4a;
        --eq-sun: #d7a43b;
        --eq-focus: #174f7a;
        --eq-shadow: 0 18px 50px rgba(37, 50, 44, 0.16);
        --eq-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: 'Noto Sans TC', 'Trebuchet MS', sans-serif;
        color: var(--eq-ink);
        background: var(--eq-paper);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .eq-screen {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        overflow: hidden;
        padding: 28px;
        background:
          linear-gradient(135deg, rgba(63, 118, 89, 0.18), transparent 34%),
          linear-gradient(315deg, rgba(47, 114, 136, 0.2), transparent 38%),
          var(--eq-paper);
      }

      .eq-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.55;
        background-image:
          linear-gradient(rgba(139, 110, 49, 0.13) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 110, 49, 0.1) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, rgba(0, 0, 0, 0.18));
      }

      .eq-screen--playing {
        background-color: #eef3e5;
      }

      .eq-screen--victory {
        background-color: #f5ead4;
      }

      .eq-screen--vocab-management {
        background-color: #edf2e8;
      }

      .eq-panel {
        border: 1px solid color-mix(in srgb, var(--eq-line) 72%, white);
        border-radius: 8px;
        background: var(--eq-panel);
        box-shadow: var(--eq-shadow);
      }

      .eq-display {
        font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
        letter-spacing: 0;
      }

      .eq-menu {
        width: min(100%, 980px);
        min-height: calc(100vh - 56px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 28px;
        align-items: center;
      }

      .eq-menu__mark {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        border: 2px solid var(--eq-line-strong);
        border-radius: 8px;
        background: color-mix(in srgb, var(--eq-paper-strong) 82%, var(--eq-sun));
        color: var(--eq-forest);
        box-shadow: 8px 8px 0 rgba(63, 118, 89, 0.18);
      }

      .eq-menu__title {
        margin-top: 20px;
        color: var(--eq-ink);
        font-size: 3.25rem;
        line-height: 0.95;
      }

      .eq-menu__subtitle {
        margin-top: 12px;
        color: var(--eq-muted);
        font-size: 1.125rem;
        font-weight: 700;
      }

      .eq-menu__actions {
        display: grid;
        gap: 12px;
      }

      .eq-game-shell {
        width: min(100%, 1160px);
        margin: 0 auto;
      }

      .eq-hud {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .eq-stat {
        min-height: 68px;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "icon label"
          "icon value";
        align-items: center;
        column-gap: 10px;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, var(--eq-line) 62%, white);
        border-radius: 8px;
        background: rgba(255, 250, 235, 0.78);
      }

      .eq-stat__icon {
        grid-area: icon;
        display: grid;
        place-items: center;
      }

      .eq-stat__label {
        grid-area: label;
        color: var(--eq-muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .eq-stat__value {
        grid-area: value;
        color: var(--eq-ink);
        font-size: 1.25rem;
        font-weight: 800;
        line-height: 1.1;
      }

      .eq-stat--gold .eq-stat__icon { color: var(--eq-sun); }
      .eq-stat--green .eq-stat__icon { color: var(--eq-forest); }
      .eq-stat--blue .eq-stat__icon { color: var(--eq-river); }
      .eq-stat--red .eq-stat__icon { color: var(--eq-rust); }

      .eq-game-grid {
        display: grid;
        grid-template-columns: minmax(280px, 0.86fr) minmax(330px, 1.14fr);
        gap: 18px;
        align-items: stretch;
      }

      .eq-level-panel,
      .eq-challenge-panel {
        padding: 22px;
      }

      .eq-level-title {
        color: var(--eq-forest);
        font-size: 2rem;
        line-height: 1.1;
      }

      .eq-objective {
        margin-top: 14px;
        padding: 10px 12px;
        border: 1px dashed color-mix(in srgb, var(--eq-line-strong) 72%, white);
        border-radius: 8px;
        color: var(--eq-river);
        background: rgba(255, 255, 255, 0.46);
        font-weight: 800;
      }

      .eq-intent-chip {
        margin-top: 10px;
        display: grid;
        gap: 3px;
        padding: 10px 12px;
        border: 1px solid rgba(47, 114, 136, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.48);
      }

      .eq-intent-chip span {
        color: var(--eq-muted);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .eq-intent-chip strong {
        color: var(--eq-ink);
        font-size: 0.95rem;
        line-height: 1.25;
      }

      .eq-intent-chip--flame,
      .eq-intent-chip--trick {
        border-color: color-mix(in srgb, var(--eq-rust) 34%, white);
      }

      .eq-intent-chip--guard,
      .eq-intent-chip--seal {
        border-color: color-mix(in srgb, var(--eq-forest) 34%, white);
      }

      .eq-intent-chip--spell {
        border-color: color-mix(in srgb, var(--eq-river) 34%, white);
      }

      .eq-enemy-figure {
        margin: 20px 0 16px;
        min-height: 224px;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 7rem;
        line-height: 1;
      }

      .eq-enemy-artwork {
        width: min(232px, 70vw);
        height: 224px;
        object-fit: contain;
        filter: drop-shadow(0 18px 18px rgba(92, 61, 28, 0.22));
      }

      .eq-word-stage {
        position: relative;
        min-height: 224px;
        display: grid;
        place-items: center;
        text-align: center;
        transition: transform 180ms var(--eq-ease-out), filter 180ms var(--eq-ease-out);
      }

      .eq-word-stage--feedback-success {
        transform: translateY(-3px) rotate(-1deg) scale(1.03);
        filter: saturate(1.12);
      }

      .eq-word-stage--feedback-caution {
        transform: translateX(-2px);
        filter: saturate(0.92);
      }

      .eq-word-stage--feedback-celebration {
        transform: translateY(-5px) scale(1.04);
        filter: saturate(1.18) brightness(1.03);
      }

      .eq-word-stage--feedback-voice {
        filter: drop-shadow(0 0 12px rgba(47, 114, 136, 0.18));
      }

      .eq-word-image {
        font-size: 7rem;
        line-height: 1;
      }

      .eq-word-photo {
        width: min(218px, 70vw);
        height: 196px;
        object-fit: contain;
        padding: 10px;
        border: 1px solid color-mix(in srgb, var(--eq-line) 58%, transparent);
        border-radius: 8px;
        background: radial-gradient(circle at 50% 58%, rgba(255, 244, 205, 0.92), rgba(255, 255, 255, 0.22) 62%, transparent 72%);
        filter: drop-shadow(0 14px 13px rgba(92, 61, 28, 0.16));
      }

      .eq-challenge-prompt {
        margin-top: 8px;
        color: var(--eq-river);
        font-size: 1rem;
        font-weight: 900;
      }

      .eq-guided-hint {
        margin-top: 6px;
        padding: 6px 10px;
        border: 1px dashed rgba(47, 114, 136, 0.35);
        border-radius: 8px;
        color: var(--eq-forest);
        background: rgba(255, 255, 255, 0.48);
        font-size: 1.15rem;
        font-weight: 900;
      }

      .eq-hint-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--eq-paper-strong);
        background: rgba(37, 50, 44, 0.84);
      }

      .eq-transcript {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border: 1px solid rgba(47, 114, 136, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.44);
      }

      .eq-voice-review {
        min-height: 136px;
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 14px;
        border: 1px solid rgba(47, 114, 136, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.56);
        text-align: center;
      }

      .eq-choice-grid {
        width: min(100%, 430px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .eq-choice-card {
        min-height: 142px;
        display: grid;
        place-items: center;
        border: 2px solid color-mix(in srgb, var(--eq-line) 66%, white);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);
        box-shadow: 0 8px 18px rgba(37, 50, 44, 0.1);
        transition: transform 140ms ease, border-color 140ms ease, background-color 140ms ease;
      }

      .eq-choice-card:hover,
      .eq-choice-card:focus-visible {
        transform: translateY(-2px);
        border-color: var(--eq-river);
        background: rgba(255, 255, 255, 0.78);
      }

      .eq-choice-card__image {
        width: 120px;
        height: 110px;
        object-fit: contain;
        filter: drop-shadow(0 10px 10px rgba(92, 61, 28, 0.14));
      }

      .eq-choice-card__emoji {
        font-size: 4rem;
        line-height: 1;
      }

      .eq-voice-review p {
        margin: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      .eq-voice-review__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 4px;
      }

      .eq-feedback-status {
        min-height: 44px;
        display: grid;
        place-items: center;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid rgba(47, 114, 136, 0.22);
        border-radius: 8px;
        color: var(--eq-ink);
        background: rgba(255, 255, 255, 0.5);
        text-align: center;
      }

      .eq-feedback-status p {
        margin: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        font-weight: 800;
      }

      .eq-feedback-status--success {
        border-color: color-mix(in srgb, var(--eq-forest) 42%, white);
        background: color-mix(in srgb, var(--eq-forest) 12%, white);
      }

      .eq-feedback-status--caution {
        border-color: color-mix(in srgb, var(--eq-rust) 44%, white);
        background: color-mix(in srgb, var(--eq-rust) 12%, white);
      }

      .eq-feedback-status--celebration {
        border-color: color-mix(in srgb, var(--eq-sun) 54%, white);
        background: color-mix(in srgb, var(--eq-sun) 18%, white);
      }

      .eq-feedback-status--voice {
        border-color: color-mix(in srgb, var(--eq-river) 42%, white);
        background: color-mix(in srgb, var(--eq-river) 12%, white);
      }

      .eq-control-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .eq-button {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 800;
        transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease;
      }

      .eq-button:hover:not(:disabled),
      .eq-icon-button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .eq-button:disabled,
      .eq-icon-button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
        transform: none;
      }

      .eq-button--primary {
        color: #fffaf0;
        background: var(--eq-forest);
      }

      .eq-button--primary:hover:not(:disabled) {
        background: #315f47;
      }

      .eq-button--secondary {
        color: #fffaf0;
        background: var(--eq-river);
      }

      .eq-button--danger {
        color: #fffaf0;
        background: var(--eq-rust);
      }

      .eq-button--quiet {
        color: var(--eq-ink);
        border-color: rgba(139, 110, 49, 0.34);
        background: rgba(255, 255, 255, 0.42);
      }

      .eq-button--gold {
        color: #352817;
        background: var(--eq-sun);
      }

      .eq-icon-button {
        width: 48px;
        height: 48px;
        display: inline-grid;
        place-items: center;
        border: 1px solid rgba(139, 110, 49, 0.36);
        border-radius: 8px;
        color: var(--eq-ink);
        background: rgba(255, 255, 255, 0.46);
        transition: transform 140ms ease, background-color 140ms ease;
      }

      .eq-icon-button--danger {
        color: #fffaf0;
        background: var(--eq-rust);
      }

      .eq-select,
      .eq-input {
        min-height: 46px;
        border: 1px solid rgba(47, 114, 136, 0.36);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.62);
        color: var(--eq-ink);
        font-weight: 700;
      }

      .eq-select {
        padding: 10px 12px;
      }

      .eq-input {
        width: min(100%, 320px);
        padding: 10px 14px;
      }

      .eq-button:focus-visible,
      .eq-icon-button:focus-visible,
      .eq-select:focus-visible,
      .eq-input:focus-visible {
        outline: 3px solid var(--eq-focus);
        outline-offset: 3px;
      }

      .eq-message {
        margin-top: 16px;
        color: var(--eq-ruby);
        font-weight: 900;
      }

      .eq-message--feedback {
        animation: eq-feedback-rise 240ms var(--eq-ease-out);
      }

      .eq-message--feedback-success {
        color: var(--eq-forest);
      }

      .eq-message--feedback-caution {
        color: var(--eq-rust);
      }

      .eq-message--feedback-celebration {
        color: var(--eq-river);
      }

      .eq-vocab-shell {
        width: min(100%, 1040px);
        margin: 0 auto;
      }

      .eq-vocab-list {
        max-height: 520px;
        overflow: auto;
        border: 1px solid rgba(139, 110, 49, 0.26);
        border-radius: 8px;
      }

      .eq-vocab-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid rgba(139, 110, 49, 0.16);
      }

      .eq-vocab-row:last-child {
        border-bottom: 0;
      }

      .eq-preview {
        width: 64px;
        height: 64px;
        border-radius: 8px;
        border: 1px solid rgba(139, 110, 49, 0.34);
        object-fit: contain;
        padding: 5px;
        background: rgba(255, 255, 255, 0.42);
      }

      .eq-preview--empty {
        display: grid;
        place-items: center;
        border-style: dashed;
        color: var(--eq-muted);
      }

      @keyframes eq-feedback-rise {
        from {
          opacity: 0.35;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes eq-impact-focus {
        0% {
          transform: translateY(0) scale(1);
        }
        45% {
          transform: translateY(-3px) scale(1.015);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }

      .eq-enemy-figure--feedback-success,
      .eq-enemy-figure--feedback-celebration {
        animation: eq-impact-focus 360ms var(--eq-ease-out);
      }

      .eq-enemy-figure--feedback-caution {
        filter: saturate(0.9);
      }

      @media (max-width: 820px) {
        .eq-screen {
          padding: 12px;
        }

        .eq-menu {
          min-height: calc(100vh - 24px);
          grid-template-columns: 1fr;
          align-content: center;
        }

        .eq-menu__title {
          font-size: 2.6rem;
        }

        .eq-hud {
          position: sticky;
          top: 8px;
          z-index: 3;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .eq-game-grid {
          grid-template-columns: 1fr;
        }

        .eq-level-panel,
        .eq-challenge-panel {
          padding: 16px;
        }

        .eq-control-row {
          display: grid;
          grid-template-columns: 1fr;
        }

        .eq-choice-grid {
          grid-template-columns: 1fr 1fr;
        }

        .eq-control-row > * {
          width: 100%;
        }

        .eq-vocab-row {
          grid-template-columns: auto 1fr;
        }

        .eq-vocab-actions {
          grid-column: 1 / -1;
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .eq-word-stage--feedback-success,
        .eq-word-stage--feedback-caution,
        .eq-word-stage--feedback-celebration,
        .eq-word-stage--feedback-voice,
        .eq-feedback-status,
        .eq-message--feedback,
        .eq-enemy-figure--feedback-success,
        .eq-enemy-figure--feedback-caution,
        .eq-enemy-figure--feedback-celebration {
          animation: none !important;
          transform: none !important;
          filter: none !important;
        }
      }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="index.js"></script>
</body>
</html>
