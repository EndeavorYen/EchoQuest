<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>EchoQuest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%231a1c2c'/%3E%3Cpath fill='%23ffcd75' d='M3 1h2v1h1v1h1v2H6v1H5v1H3V7H2V6H1V3h1V2h1z'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1a1c2c;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #textfield {
        position: fixed;
        left: -9999px;
        top: 0;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <input id="textfield" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
